<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Community Survey | The JJ Center</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--p1:#16082b;--p2:#2a1052;--p3:#3d1a7a;--p4:#5a2da8;--p5:#7b4fd4;--p6:#c4a8f5;--gold:#c8922a;--gold2:#e8b84b;--sans:'Outfit',sans-serif;--serif:'Cormorant Garamond',serif;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{min-height:100%;font-family:var(--sans);}
body{background:var(--p1);color:#e8e0f4;padding-bottom:60px;}

/* SKIP BUTTON */
.skip-wrap{position:fixed;top:14px;right:16px;z-index:100;}
.btn-skip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7);padding:8px 16px;border-radius:100px;font-size:13px;cursor:pointer;font-family:var(--sans);transition:all .2s;}
.btn-skip:hover{background:rgba(255,255,255,.18);color:white;}

/* HEADER */
.survey-header{background:linear-gradient(135deg,var(--p2),var(--p3));padding:40px 24px 32px;text-align:center;}
.org-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--p6);font-weight:600;margin-bottom:10px;}
.survey-title{font-family:var(--serif);font-size:clamp(26px,5vw,36px);font-weight:600;color:white;margin-bottom:14px;line-height:1.15;}
.survey-intro{font-size:14px;color:rgba(196,168,245,.8);line-height:1.75;max-width:560px;margin:0 auto;}

/* CONTENT */
.survey-content{max-width:640px;margin:0 auto;padding:32px 20px 0;}

/* QUESTION */
.q-block{background:rgba(255,255,255,.05);border:1px solid rgba(196,168,245,.12);border-radius:16px;padding:22px 20px;margin-bottom:18px;}
.q-label{font-size:15px;font-weight:600;color:#e8e0f4;margin-bottom:14px;line-height:1.5;}
.q-opt-hint{font-size:12px;color:rgba(196,168,245,.5);margin-bottom:10px;}

/* RADIO / CHECKBOX OPTIONS */
.opt-list{display:flex;flex-direction:column;gap:8px;}
.opt-item{display:flex;align-items:center;gap:11px;padding:11px 14px;border:1.5px solid rgba(196,168,245,.15);border-radius:10px;cursor:pointer;transition:all .2s;background:rgba(255,255,255,.03);}
.opt-item:hover{border-color:var(--p5);background:rgba(123,79,212,.12);}
.opt-item.selected{border-color:var(--p5);background:rgba(123,79,212,.2);}
.opt-item input{width:16px;height:16px;accent-color:var(--p5);flex-shrink:0;cursor:pointer;}
.opt-item span{font-size:14px;color:#d8ccf0;}

/* RATING GRID */
.rating-grid{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.rating-table{width:100%;border-collapse:collapse;min-width:320px;}
.rating-table th{font-size:11px;font-weight:600;color:rgba(196,168,245,.6);text-align:center;padding:6px 4px;letter-spacing:.05em;}
.rating-table th.row-label-h{text-align:left;}
.rating-table td{text-align:center;padding:8px 4px;border-top:1px solid rgba(196,168,245,.08);}
.rating-table td.row-label{text-align:left;font-size:13px;color:#d8ccf0;padding-left:0;}
.rating-radio{width:18px;height:18px;accent-color:var(--p5);cursor:pointer;}

/* OPEN TEXT */
.open-textarea{width:100%;background:rgba(255,255,255,.06);border:1.5px solid rgba(196,168,245,.2);border-radius:10px;color:#e8e0f4;font-family:var(--sans);font-size:14px;padding:12px 14px;resize:vertical;min-height:80px;transition:border-color .2s;}
.open-textarea:focus{outline:none;border-color:var(--p5);}
.open-textarea::placeholder{color:rgba(196,168,245,.35);}

/* SUBMIT */
.submit-wrap{text-align:center;padding:8px 0 0;}
.btn-submit{background:linear-gradient(135deg,var(--p3),var(--p4));color:white;border:none;padding:16px 40px;border-radius:100px;font-size:16px;font-weight:700;font-family:var(--sans);cursor:pointer;box-shadow:0 6px 24px rgba(90,45,168,.35);transition:opacity .2s,transform .15s;}
.btn-submit:hover:not(:disabled){transform:translateY(-2px);opacity:.92;}
.btn-submit:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.submit-note{font-size:12px;color:rgba(196,168,245,.5);margin-top:12px;}

/* THANK YOU SCREEN */
#thank-you{display:none;text-align:center;padding:60px 24px;}
.ty-icon{font-size:72px;margin-bottom:20px;display:block;animation:pop .6s cubic-bezier(.22,1,.36,1);}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.ty-title{font-family:var(--serif);font-size:clamp(28px,5vw,38px);font-weight:600;color:white;margin-bottom:12px;}
.ty-title em{color:var(--gold2);font-style:italic;}
.ty-msg{font-size:15px;color:rgba(196,168,245,.8);line-height:1.75;max-width:440px;margin:0 auto 32px;}
.btn-home{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--p3),var(--p4));color:white;padding:14px 30px;border-radius:100px;font-size:15px;font-weight:600;text-decoration:none;box-shadow:0 6px 22px rgba(90,45,168,.3);}

/* LOADING */
#loading-wrap{text-align:center;padding:80px 24px;}
.spin{display:inline-block;width:36px;height:36px;border:3px solid rgba(196,168,245,.2);border-top-color:var(--p5);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="skip-wrap">
  <button class="btn-skip" onclick="skipSurvey()">Skip survey</button>
</div>

<div id="loading-wrap">
  <div class="spin"></div>
  <p style="margin-top:16px;color:rgba(196,168,245,.6);font-size:14px;">Loading survey...</p>
</div>

<div id="survey-wrap" style="display:none;">
  <div class="survey-header">
    <div class="org-label">The JJ Center &middot; Ward 8, DC</div>
    <h1 class="survey-title" id="sv-title">Community Survey</h1>
    <p class="survey-intro" id="sv-intro"></p>
  </div>

  <div class="survey-content">
    <div id="questions-wrap"></div>
    <div class="submit-wrap">
      <button class="btn-submit" id="btn-submit" onclick="submitSurvey()">Submit Survey</button>
      <p class="submit-note">All questions are optional. No personal information is collected.</p>
    </div>
  </div>
</div>

<div id="thank-you">
  <span class="ty-icon">🌟</span>
  <h2 class="ty-title">Thank you for sharing<br><em>your voice!</em></h2>
  <p class="ty-msg">Your anonymous feedback helps The JJ Center serve Wards 7 and 8 better. We read every response.</p>
  <a href="/" class="btn-home">Return to Home &rarr;</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://mkldikwqxninqcmorwsg.supabase.co';
const SUPABASE_ANON = 'sb_publishable_sL0EK7R10PR9Pi5O9vmIvQ_LpmwZhYJ';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const params = new URLSearchParams(location.search);
const source = (['checkin','account','standalone'].includes(params.get('source'))) ? params.get('source') : 'standalone';

let surveyVersion = null;
const answers = {};

async function init() {
  try {
    const { data: sv, error } = await sb
      .from('survey_versions')
      .select('*')
      .eq('is_active', true)
      .single();

    if (error || !sv) { showThankYou(); return; }

    surveyVersion = sv.version;

    // Already done?
    try {
      const done = localStorage.getItem('jj_survey_done_v' + surveyVersion);
      if (done) { showThankYou(); return; }
    } catch(_) {}

    renderSurvey(sv);
  } catch(_) {
    showThankYou();
  }
}

function renderSurvey(sv) {
  document.getElementById('sv-title').textContent = sv.title;
  document.getElementById('sv-intro').textContent = sv.intro_text;

  const wrap = document.getElementById('questions-wrap');
  const questions = sv.questions || [];

  questions.forEach((q, idx) => {
    const block = document.createElement('div');
    block.className = 'q-block';
    block.id = 'qblock-' + q.id;

    // Hide conditional questions initially
    if (q.conditional) {
      block.style.display = 'none';
    }

    let inner = `<div class="q-label">${idx + 1}. ${esc(q.text)}</div>`;

    if (q.type === 'single_choice') {
      inner += `<div class="opt-list">` +
        q.options.map(opt =>
          `<label class="opt-item" onclick="selectOpt(this,'${esc(q.id)}','single')">
            <input type="radio" name="q_${esc(q.id)}" value="${esc(opt)}" onchange="onAnswer('${esc(q.id)}','${esc(opt)}')">
            <span>${esc(opt)}</span>
          </label>`
        ).join('') +
        `</div>`;
    } else if (q.type === 'multi_choice') {
      const hint = q.max_selections ? `(Choose up to ${q.max_selections})` : '(Check all that apply)';
      inner += `<div class="q-opt-hint">${hint}</div><div class="opt-list">` +
        q.options.map(opt =>
          `<label class="opt-item" onclick="selectOpt(this,'${esc(q.id)}','multi',${q.max_selections || 99})">
            <input type="checkbox" name="q_${esc(q.id)}" value="${esc(opt)}">
            <span>${esc(opt)}</span>
          </label>`
        ).join('') +
        `</div>`;
    } else if (q.type === 'rating_grid') {
      const scale = q.scale || {min:1,max:5,labels:['Poor','Excellent']};
      const nums = [];
      for (let i = scale.min; i <= scale.max; i++) nums.push(i);
      inner += `<div class="rating-grid"><table class="rating-table">
        <thead><tr>
          <th class="row-label-h"></th>
          ${nums.map((n,i) => {
            let lbl = n;
            if (i === 0 && scale.labels?.[0]) lbl = `${n}<br><small style="font-weight:400;color:rgba(196,168,245,.4)">${esc(scale.labels[0])}</small>`;
            if (i === nums.length-1 && scale.labels?.[1]) lbl = `${n}<br><small style="font-weight:400;color:rgba(196,168,245,.4)">${esc(scale.labels[1])}</small>`;
            return `<th>${lbl}</th>`;
          }).join('')}
        </tr></thead>
        <tbody>` +
        (q.rows||[]).map(row =>
          `<tr>
            <td class="row-label">${esc(row)}</td>
            ${nums.map(n =>
              `<td><input type="radio" class="rating-radio" name="qgrid_${esc(q.id)}_${esc(row)}" value="${n}" onchange="onGridAnswer('${esc(q.id)}','${esc(row)}',${n})"></td>`
            ).join('')}
          </tr>`
        ).join('') +
        `</tbody></table></div>`;
    } else if (q.type === 'open_text') {
      inner += `<textarea class="open-textarea" placeholder="Your answer (optional)" rows="3" oninput="onTextAnswer('${esc(q.id)}',this.value)"></textarea>`;
    }

    block.innerHTML = inner;
    wrap.appendChild(block);
  });

  document.getElementById('loading-wrap').style.display = 'none';
  document.getElementById('survey-wrap').style.display = 'block';
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function selectOpt(label, qid, type, maxSel) {
  const block = label.closest('.opt-list');
  if (type === 'single') {
    block.querySelectorAll('.opt-item').forEach(el => el.classList.remove('selected'));
    label.classList.add('selected');
  } else {
    // Multi: enforce max_selections
    const checked = block.querySelectorAll('input:checked');
    if (!label.classList.contains('selected') && maxSel && checked.length >= maxSel) {
      label.querySelector('input').checked = false;
      return;
    }
    label.classList.toggle('selected', label.querySelector('input').checked);
    // Collect multi answers
    const vals = Array.from(block.querySelectorAll('input:checked')).map(i => i.value);
    answers[qid] = vals;
    return;
  }
}

function onAnswer(qid, val) {
  answers[qid] = val;
  // Handle conditional display
  checkConditionals(qid, val);
}

function checkConditionals(changedQid, val) {
  document.querySelectorAll('.q-block').forEach(block => {
    const bid = block.id.replace('qblock-', '');
    // Find question definition by id via rendered data
    // We store conditional info as data attributes... actually re-read from DOM isn't possible
    // We need to access the survey questions array
    if (!window._surveyQuestions) return;
    const q = window._surveyQuestions.find(q => q.id === bid);
    if (!q || !q.conditional) return;
    if (q.conditional.depends_on === changedQid) {
      block.style.display = (val === q.conditional.show_when) ? 'block' : 'none';
      if (val !== q.conditional.show_when) delete answers[bid];
    }
  });
}

function onGridAnswer(qid, row, val) {
  if (!answers[qid]) answers[qid] = {};
  answers[qid][row] = val;
}

function onTextAnswer(qid, val) {
  answers[qid] = val.trim() || undefined;
  if (!val.trim()) delete answers[qid];
}

async function submitSurvey() {
  const btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.textContent = 'Submitting...';
  try {
    await sb.from('survey_responses').insert({
      survey_version: surveyVersion,
      answers: answers,
      source: source
    });
    try { localStorage.setItem('jj_survey_done_v' + surveyVersion, '1'); } catch(_){}
  } catch(_) {
    // Fail silently
    try { localStorage.setItem('jj_survey_done_v' + surveyVersion, '1'); } catch(_){}
  }
  showThankYou();
}

function showThankYou() {
  document.getElementById('loading-wrap').style.display = 'none';
  document.getElementById('survey-wrap').style.display = 'none';
  document.getElementById('thank-you').style.display = 'block';
}

function skipSurvey() {
  if (surveyVersion) {
    try { localStorage.setItem('jj_survey_done_v' + surveyVersion, '1'); } catch(_){}
  }
  // Go back or home
  if (document.referrer && document.referrer.includes(location.hostname)) {
    history.back();
  } else {
    location.href = '/';
  }
}

// Store questions globally for conditional checks after render
const _origInit = init;
async function initWithStore() {
  try {
    const { data: sv, error } = await sb
      .from('survey_versions')
      .select('*')
      .eq('is_active', true)
      .single();

    if (error || !sv) { showThankYou(); return; }

    surveyVersion = sv.version;

    try {
      const done = localStorage.getItem('jj_survey_done_v' + surveyVersion);
      if (done) { showThankYou(); return; }
    } catch(_) {}

    window._surveyQuestions = sv.questions || [];
    renderSurvey(sv);
  } catch(_) {
    showThankYou();
  }
}

initWithStore();
</script>
</body>
</html>
